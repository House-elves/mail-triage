# A House Elves elf: what Elf Desk needs to install, set up and run mail-triage.
name: mail-triage
title: Mail
version: 1.9.0
author: "@phillip-kruger"
description: Sorts your unread mail with Claude, from Gmail, Google Workspace and Outlook (Office 365). Noise is marked read; what needs you is listed on its Mail tab.
main: MailTriage.java
config: ~/.config/mail-triage/config
tools: [claude]

reads:
  - Your unread inboxes over IMAP. Gmail with an app password (imap.gmail.com). Or an account you sign in to in its Settings, as Thunderbird and Evolution do. Google, for Gmail and Google Workspace, reads at imap.gmail.com after you sign in at accounts.google.com. Microsoft, for Outlook and Office 365, reads at outlook.office365.com after you sign in at login.microsoftonline.com. An organisation's app with a return address (as Evolution signs in) reads through Microsoft Graph (graph.microsoft.com) instead, only your own mailbox.
  - Each unread email's start (Claude reads it, with no tools) to sort it, and for one that needs you, to sum it up in a sentence or two.
  - An email's thread when you ask it to suggest a reply (Claude reads it, with no tools).
  - When you add a Microsoft account, Evolution's account settings on this machine, for the app your organisation has Evolution sign in with, so you can use it too.
  - When you click Find out, an agent (the runner's, in its sandbox, after a safety check, able only to read) reads the thread and the repo you name, to fill in what the reply leaves open.
  - The repos you maintain, from the GitHub elf's settings if it's installed, so a suggested reply can say where to look.
writes:
  - Marks the noise read, and at Gmail labels it with your noise label.
  - Marks an email's thread read when you click Done.
  - Moves an email's thread in your inbox to its account's Trash (Deleted Items at Outlook) when you click Delete and confirm it in the desk's bar. Nothing is deleted for good: it stays in the Trash until your mail empties it.
  - Sends your reply to an email (to its sender, and with Reply all its other recipients), from the account it came to over SMTP (smtp.gmail.com or smtp.office365.com) or through Microsoft Graph, only when you click and confirm it in the desk's bar.
  - Keeps your accounts (the sign-ins you made, and a Gmail's app password) and each one's colour in ~/.config/mail-triage/signins.json, readable only by you, until you remove the account. The Google client and Microsoft app you give Add account go in its config file. Signing in to Google, it listens on this machine (127.0.0.1) for up to 5 minutes for your browser to come back from Google's page.

# Your accounts are a list at the top of its Settings pop-up (ui/accounts.js): Add account adds a Gmail with an app
# password or signs you in, asking for the Google client or Microsoft app the first time, and keeps them itself.
settings:
  - key: MAX_EMAILS
    label: Emails per run
    help: The most unread emails one run looks at.
    kind: int
    min: 1
    max: 500
    default: "50"
  - key: TRIAGE_LABEL
    label: Label for noise
    help: The Gmail label for what it marks read.
    kind: words
    default: non-actionable

commands:
  triage:
    label: Sort the inbox
    args: []
  dry-run:
    label: Sort without marking anything
    args: [--dry-run]

dry-run: dry-run

# Its tab (and dashboard card), drawn by ui/mail.js in the desk's sandboxed frame. It reads only the runs it saved and
# what you marked done.
tab:
  page: ui/mail.js
  card: true
  # How you write (for suggested replies) is drawn by the same page, at the top of its Settings pop-up.
  settings: true
refresh:
  command: triage
  schedule: "Mon..Fri *-*-* 07:00"
data: [runs, done, style]
# Find out starts an agent; its report is in ~/.config/mail-triage/agents, which the tab reads.
agents: true

actions:
  done:
    label: Mark an email's thread read in Gmail
    args: [--action=done]
    ask: false
    params:
      account: {kind: email}
      # A Message-ID: printable, never starting with "-", nothing that could break the IMAP search.
      messageId: {pattern: "<?[\\x21-\\x7E&&[^-\"\\\\<>()]][\\x21-\\x7E&&[^\"\\\\<>()]]{0,499}>?", max: 502}
  delete:
    label: Delete an email's thread (to its account's Trash)
    args: [--action=delete]
    confirm: "Delete this email from {account}? Its thread in your inbox goes to the Trash, where you can still get it back."
    params:
      account: {kind: email}
      messageId: {pattern: "<?[\\x21-\\x7E&&[^-\"\\\\<>()]][\\x21-\\x7E&&[^\"\\\\<>()]]{0,499}>?", max: 502}
  draft-reply:
    label: Suggest a reply to an email
    args: [--action=draft-reply]
    ask: false
    params:
      account: {kind: email}
      messageId: {pattern: "<?[\\x21-\\x7E&&[^-\"\\\\<>()]][\\x21-\\x7E&&[^\"\\\\<>()]]{0,499}>?", max: 502}
  send-reply:
    label: Send a reply by email
    args: [--action=send-reply]
    confirm: "Send your reply to {to} from {account}, as you?"
    params:
      account: {kind: email}
      messageId: {pattern: "<?[\\x21-\\x7E&&[^-\"\\\\<>()]][\\x21-\\x7E&&[^\"\\\\<>()]]{0,499}>?", max: 502}
      # Everyone it goes to, for the confirm bar's words ("a@x", or "a@x, cc b@y" for Reply all): the elf refuses to
      # send unless that's who the email says now.
      to: {pattern: "\\P{Cntrl}{3,4000}", max: 4000}
      # Reply all: the email's other recipients as Cc.
      all: {kind: bool}
      content: {pattern: "[\\s\\S]{1,20000}", max: 20000}
  find-out:
    label: Have an agent look up what a suggested reply leaves open
    args: [--action=find-out]
    ask: false
    params:
      account: {kind: email}
      messageId: {pattern: "<?[\\x21-\\x7E&&[^-\"\\\\<>()]][\\x21-\\x7E&&[^\"\\\\<>()]]{0,499}>?", max: 502}
      # The reply as you have it now, with its [placeholders], and the repo to look in: owner/name, or mine for
      # whichever of your repos (the GitHub elf's Repos I maintain) Claude thinks likeliest to answer them.
      content: {pattern: "[\\s\\S]{1,20000}", max: 20000}
      repo: {pattern: "mine|[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}"}
  accounts:
    label: List the accounts it sorts
    args: [--action=accounts]
    ask: false
  microsoft-sign-in:
    label: Sign in to Microsoft
    confirm: Sign in to Microsoft so Mail can read, mark and send your Outlook mail?
    args: [--action=microsoft-sign-in]
  microsoft-check:
    label: Finish signing in to Microsoft
    args: [--action=microsoft-check]
    ask: false
  microsoft-finish:
    label: Finish signing in to Microsoft with where its page landed
    args: [--action=microsoft-finish]
    ask: false
    params:
      # The blank page's address, with Microsoft's one-time code: only good with the key the sign-in kept.
      address: {pattern: "https?://[\\x21-\\x7E]{10,4000}", max: 4100}
  google-sign-in:
    label: Sign in to Google
    confirm: Sign in to Google so Mail can read, mark and send your Gmail?
    args: [--action=google-sign-in]
  google-check:
    label: Finish signing in to Google
    args: [--action=google-check]
    ask: false
  add-gmail:
    label: Add a Gmail with an app password
    args: [--action=add-gmail]
    ask: false
    params:
      email: {kind: email}
      # Google's 16 letters, in fours or not.
      password: {pattern: "[a-zA-Z ]{16,19}", max: 19}
  set-colour:
    label: Set an account's colour
    args: [--action=set-colour]
    ask: false
    params:
      account: {kind: email}
      colour: {max: 7, pattern: "#[0-9a-fA-F]{6}"}
  microsoft-app:
    label: Set the Microsoft app
    args: [--action=microsoft-app]
    ask: false
    params:
      # Checked again by the script.
      app: {max: 36, pattern: "[0-9a-fA-F-]{36}"}
      tenant: {max: 100, pattern: "[A-Za-z0-9.-]{0,100}"}
      redirect: {max: 400, pattern: "(https?://[\\x21-\\x7E]{3,390})?"}
  microsoft-evolution:
    label: Find the Microsoft app Evolution uses
    args: [--action=microsoft-evolution]
    ask: false
  google-app:
    label: Set the Google client
    args: [--action=google-app]
    ask: false
    params:
      app: {max: 120, pattern: "[0-9a-z.-]{10,120}"}
      secret: {max: 100, pattern: "[\\x21-\\x7E]{0,100}"}
  sign-out:
    label: Remove an account
    confirm: Remove {account} from Mail? Its sign-in or app password is forgotten; Add account brings it back.
    args: [--action=sign-out]
    params:
      account: {kind: email}
  learn-style:
    label: Learn how you write from your own messages
    args: [--action=learn-style]
    ask: false
  save-style:
    label: Save how you write
    args: [--action=save-style]
    ask: false
    params:
      text: {pattern: "[\\s\\S]{0,4000}", max: 4000}
